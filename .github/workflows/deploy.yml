# Publica la landing en el hosting de DonWeb por FTPS en cada push a main.
#
# Configuración (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variable (opcional): FTP_SERVER_DIR  — carpeta del sitio en el servidor (por defecto public_html)
#
# Mientras falten los secrets, el workflow igual compila el sitio pero saltea la subida.

name: Deploy a DonWeb

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-donweb
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # DonWeb exige TLS en el canal de control y de datos; lftp lo maneja mejor que las actions de FTP en Node.
      - name: Subir sitio por FTPS
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || 'public_html' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Credenciales vía .netrc para no romper contraseñas con caracteres especiales
          printf 'machine %s login %s password %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc
          set +e
          lftp -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 30;
            mirror --reverse --verbose --parallel=4 ./out/ '$FTP_SERVER_DIR';
            bye
          " "$FTP_SERVER" 2>&1 | tee lftp.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Mostrar el error como anotación (visible sin iniciar sesión en GitHub)
            echo "::error title=lftp falló::$(tail -n 15 lftp.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit "$status"
          fi

      - name: Aviso de configuración pendiente
        if: env.FTP_SERVER == ''
        run: echo "::warning::Faltan los secrets FTP_SERVER, FTP_USERNAME y FTP_PASSWORD. El sitio se compiló pero no se subió."
