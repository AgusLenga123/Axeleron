# Publica la landing en el hosting de DonWeb por FTPS en cada push a main.
#
# Configuración (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variable (opcional): FTP_SERVER_DIR  — carpeta del sitio en el servidor (por defecto public_html)
#
# Mientras falten los secrets, el workflow igual compila el sitio pero saltea la subida.

name: Deploy a DonWeb

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-donweb
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # DonWeb exige TLS en el canal de control y de datos; lftp lo maneja mejor que las actions de FTP en Node.
      - name: Subir sitio por FTPS
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || 'public_html' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # La contraseña va por variable de entorno para no romperse con caracteres especiales
          export LFTP_PASSWORD="$FTP_PASSWORD"
          server="$(echo "$FTP_SERVER" | sed -E 's#^[a-z]+://##; s#/+$##' | tr -d '[:space:]')"
          set +e
          {
            echo "host: $(getent ahosts "$server" | awk '{print $1}' | sort -u | tr '\n' ' ')"
            timeout 10 bash -c "echo > /dev/tcp/$server/21" && echo "puerto 21: abierto" || echo "puerto 21: sin respuesta"
          } > diag.log 2>&1
          cat diag.log
          lftp -d -u "$FTP_USERNAME" --env-password -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate no;
            set ssl:check-hostname no;
            set net:max-retries 2;
            set net:timeout 30;
            set net:reconnect-interval-base 5;
            mirror --reverse --verbose --parallel=2 ./out/ '$FTP_SERVER_DIR';
            bye
          " "ftp://$server" > lftp.log 2>&1
          status=$?
          grep -v -E '^---> PASS' lftp.log | tail -n 200
          if [ "$status" -ne 0 ]; then
            # Mostrar el error como anotación (visible sin iniciar sesión en GitHub), sin la contraseña
            echo "::error title=lftp falló::$({ cat diag.log; grep -v -E 'PASS' lftp.log | tail -n 40; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit "$status"
          fi

      - name: Aviso de configuración pendiente
        if: env.FTP_SERVER == ''
        run: echo "::warning::Faltan los secrets FTP_SERVER, FTP_USERNAME y FTP_PASSWORD. El sitio se compiló pero no se subió."
