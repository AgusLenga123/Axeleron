# Publica la landing en el hosting de DonWeb por FTPS en cada push a main.
#
# Configuración (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variable (opcional): FTP_SERVER_DIR  — carpeta del sitio en el servidor (por defecto public_html)
#
# Mientras falten los secrets, el workflow igual compila el sitio pero saltea la subida.

name: Deploy a DonWeb

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-donweb
  # Un deploy nuevo cancela al que esté corriendo (igual sube todo de nuevo)
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # DonWeb exige FTPS (TLS en control y datos). Su servidor (ProFTPD) pide reutilizar la sesión TLS en la
      # conexión de datos y con TLS 1.3 eso falla de forma intermitente (subidas colgadas): por eso --tls-max 1.2.
      - name: Subir sitio por FTPS
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || 'public_html' }}
        run: |
          server="$(echo "$FTP_SERVER" | sed -E 's#^[a-z]+://##; s#/+$##' | tr -d '[:space:]')"
          dir="$(echo "$FTP_SERVER_DIR" | sed -E 's#^\./##; s#^/+##; s#/+$##')"
          base="ftp://$server/${dir:+$dir/}"
          # Credenciales en un archivo de config de curl: no se rompen con caracteres especiales
          esc() { printf %s "$1" | sed 's/[\\"]/\\&/g'; }
          printf 'user = "%s:%s"\n' "$(esc "$FTP_USERNAME")" "$(esc "$FTP_PASSWORD")" > "$RUNNER_TEMP/curl.cfg"
          chmod 600 "$RUNNER_TEMP/curl.cfg"

          # Sube una lista de archivos con UN solo proceso de curl: reutiliza la conexión y el login
          # (iniciar sesión una vez por archivo hacía que el servidor frenara o colgara las subidas).
          upload() { # $1 = archivo con la lista (separada por \0), $2 = log de resultados
            : > "$RUNNER_TEMP/batch.cfg"
            while IFS= read -r -d '' f; do
              printf 'upload-file = "%s"\nurl = "%s"\n' "$(esc "$f")" "$(esc "$base${f// /%20}")" >> "$RUNNER_TEMP/batch.cfg"
            done < "$1"
            curl --config "$RUNNER_TEMP/curl.cfg" --config "$RUNNER_TEMP/batch.cfg" \
                 --ssl-reqd --insecure --tls-max 1.2 --ftp-pasv --ftp-create-dirs --globoff --silent --show-error \
                 --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
                 -w '%{response_code} %{url_effective}\n' > "$2" 2>> ../upload.log || true
          }

          cd out
          # Primero CSS/JS/imágenes y al final los HTML: así nunca queda online una página que pide archivos que todavía no se subieron
          { find . -type f ! -name '*.html' -printf '%P\0'; find . -type f -name '*.html' -printf '%P\0'; } > ../files.lst
          total=$(tr -cd '\0' < ../files.lst | wc -c)

          upload ../files.lst ../result.log
          # Reintento de lo que haya fallado (226 = transferencia completa en FTP)
          for pass in 1 2 3; do
            : > ../retry.lst
            while IFS= read -r -d '' f; do
              grep -qxF "226 $base${f// /%20}" ../result.log || printf '%s\0' "$f" >> ../retry.lst
            done < ../files.lst
            [ -s ../retry.lst ] && [ "$pass" -lt 3 ] || break
            echo "Reintentando $(tr -cd '\0' < ../retry.lst | wc -c) archivos (pasada $pass)"
            upload ../retry.lst ../retry-result.log
            cat ../retry-result.log >> ../result.log
          done
          cd ..
          rm -f "$RUNNER_TEMP/curl.cfg" "$RUNNER_TEMP/batch.cfg"

          failed=0
          if [ -s retry.lst ]; then
            failed=$(tr -cd '\0' < retry.lst | wc -c)
            tr '\0' '\n' < retry.lst | sed 's/^/falló: /' >> upload.log
          fi
          echo "Subidos $((total - failed)) de $total archivos a $base"
          if [ "$failed" -ne 0 ]; then
            # Visible como anotación sin iniciar sesión en GitHub
            echo "::error title=Falló la subida ($failed de $total)::$(head -n 20 upload.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Aviso de configuración pendiente
        if: env.FTP_SERVER == ''
        run: echo "::warning::Faltan los secrets FTP_SERVER, FTP_USERNAME y FTP_PASSWORD. El sitio se compiló pero no se subió."
