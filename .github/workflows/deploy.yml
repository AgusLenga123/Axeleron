# Publica la landing en DonWeb a través de su "Integración con Git".
#
# En cada push a main: compila el sitio estático (carpeta out/) y lo publica como un commit nuevo
# en la rama `deploy` de este repo. DonWeb está conectado a esa rama y trae los cambios.
#
# Opcional (GitHub → Settings → Secrets and variables → Actions):
#   Secret DONWEB_DEPLOY_HOOK — si DonWeb da una URL para disparar el deploy, se llama al final.

name: Deploy a DonWeb

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-donweb
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DONWEB_DEPLOY_HOOK: ${{ secrets.DONWEB_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Historia lineal en `deploy` (sin force-push) para que DonWeb pueda hacer `git pull` sin conflictos
      - name: Publicar el sitio en la rama deploy
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch --depth=1 origin deploy 2>/dev/null; then
            git worktree add -B deploy ../site origin/deploy
          else
            # Primera vez: rama nueva sin historia
            git worktree add --detach ../site
            git -C ../site checkout -q --orphan deploy
            git -C ../site rm -rfq .
          fi

          # Reemplaza todo el contenido por el sitio recién compilado (conserva solo .git)
          rsync -a --delete --exclude .git out/ ../site/

          cd ../site
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios en el sitio: no hay nada que publicar."
          else
            git commit -q -m "Deploy ${GITHUB_SHA::7}: $(printf '%s' "${COMMIT_MSG:-manual}" | head -n 1)"
            git push origin deploy
            echo "Publicado en la rama deploy ($(git rev-parse --short HEAD))."
          fi

      - name: Avisar a DonWeb
        if: env.DONWEB_DEPLOY_HOOK != ''
        run: curl -fsS -m 60 -X POST "$DONWEB_DEPLOY_HOOK" && echo "DonWeb notificado."
